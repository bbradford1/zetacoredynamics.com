<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ZetaCore Dynamics — OG Card Preview (1200×630)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1a1a1a; }

  @font-face {
    font-family: 'Cormorant Garamond';
    font-style: normal;
    font-weight: 400 700;
    font-display: block;
    src: url('../fonts/cormorant-garamond-v21-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-style: normal;
    font-weight: 300 600;
    font-display: block;
    src: url('../fonts/dm-sans-v17-latin.woff2') format('woff2');
  }

  /* Card frame — exact 1200×630 for screenshot */
  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 80% 30%, rgba(46,122,224,0.25), transparent 55%),
      linear-gradient(135deg, #0B1F3A 0%, #162E52 60%, #1A4B8C 100%);
    color: #fff;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* Subtle grid overlay */
  .card::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    pointer-events: none;
  }

  /* Left accent bar */
  .card::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(180deg, #2E7AE0 0%, #5B9BF0 100%);
  }

  .content {
    position: relative;
    height: 100%;
    padding: 64px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top row: brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-mark {
    width: 48px; height: 48px;
    background: #0B1F3A;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .brand-mark svg { display: block; width: 100%; height: 100%; }
  .brand-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .brand-sub {
    font-size: 12px;
    font-weight: 500;
    color: #5B9BF0;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-left: 16px;
    padding-left: 16px;
    border-left: 1px solid rgba(91,155,240,0.4);
  }

  /* Middle: headline + sub */
  .headline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 84px;
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #fff;
    max-width: 960px;
  }
  .headline em {
    font-style: italic;
    color: #5B9BF0;
  }
  .subhead {
    margin-top: 28px;
    font-size: 22px;
    line-height: 1.5;
    color: rgba(255,255,255,0.85);
    max-width: 880px;
    font-weight: 300;
  }

  /* Bottom row: tags + URL */
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .tags {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #5B9BF0;
    padding: 8px 16px;
    border: 1px solid rgba(91,155,240,0.45);
    border-radius: 4px;
    background: rgba(46,122,224,0.08);
  }
  .url {
    font-size: 18px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="40" height="40" rx="6" fill="#0B1F3A"/>
            <path d="M8 12 L20 12 L32 12" stroke="#2E7AE0" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 12 L20 28" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 28 L32 12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="28" r="3" fill="#2E7AE0"/>
            <circle cx="8" cy="12" r="2" fill="white" opacity="0.5"/>
            <circle cx="32" cy="12" r="2" fill="white" opacity="0.5"/>
          </svg>
        </div>
        <div class="brand-name">ZetaCore Dynamics</div>
        <div class="brand-sub">Texas, USA</div>
      </div>

      <div>
        <div class="headline">
          Purpose-Built for<br><em>Complex</em> Industries
        </div>
        <div class="subhead">
          Precision-grade ventures for regulated, high-stakes industries that demand reliability, security, and performance.
        </div>
      </div>

      <div class="bottom">
        <div class="tags">
          <span class="tag">On-Premise</span>
          <span class="tag">NDAA</span>
          <span class="tag">Sovereign</span>
        </div>
        <div class="url">zetacoredynamics.com</div>
      </div>
    </div>
  </div>
</body>
</html>
